# SuperR source checks (no IDE build). SPDX-License-Identifier: AGPL-3.0-only
#
# Product identity consistency (package/superr/product.json against its GWT,
# desktop and R copies; generated branding against the logo master) and the
# R contract tests of the plot editor and length-frequency modules, with
# packages from CRAN. The installer itself is built by superr-release.yml.
name: SuperR checks

on:
  push:
    branches: ['feature/**', 'release/**', 'upstream-sync/**']
    paths:
      - 'superrstudio/**'
      - 'package/superr/**'
      - 'assets/branding/**'
      - 'src/cpp/session/modules/SessionSuperRStudio*.R'
      - 'src/gwt/src/org/rstudio/studio/client/workbench/views/superrstudio/**'
      - 'src/node/desktop/src/main/superr-identity.ts'
      - 'src/node/desktop/src/main/superr-agent/**'
      - 'src/node/desktop/src/main/superr-updater/**'
      - 'src/node/desktop/CMakeLists.txt'
      - 'src/node/desktop/src/main/gwt-callback.ts'
      - 'src/node/desktop/src/renderer/desktop-bridge.ts'
      - 'src/gwt/src/org/rstudio/studio/client/application/ui/impl/DesktopApplicationHeader.java'
      - 'src/gwt/src/org/rstudio/studio/client/workbench/prefs/views/GeneralPreferencesPane.java'
      - 'tools/superrstudio/**'
      - 'tests/superrstudio/**'
      - '.github/workflows/superr-checks.yml'
      - '.github/workflows/superr-release.yml'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-components:
    strategy:
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.2'
      - name: Install pinned test dependencies without lifecycle scripts
        working-directory: tests/superrstudio/agent-test-deps
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check agent components
        run: node tests/superrstudio/agent-test-deps/node_modules/typescript/bin/tsc -p tests/superrstudio/agent-test-deps/tsconfig.json
      - name: Agent protocol, authorization and safety tests
        env:
          NODE_PATH: ${{ github.workspace }}/tests/superrstudio/agent-test-deps/node_modules
          TS_NODE_PROJECT: ${{ github.workspace }}/src/node/desktop/tsconfig.json
          TS_NODE_TRANSPILE_ONLY: '1'
        run: >-
          node --test --require ts-node/register
          tests/superrstudio/agent-transport.test.cjs
          tests/superrstudio/agent-project-reader.test.cjs
          tests/superrstudio/agent-text-proposal.test.cjs
          tests/superrstudio/agent-oidc.test.cjs
          tests/superrstudio/agent-chatgpt-auth.test.cjs
          tests/superrstudio/agent-vault.test.cjs
          tests/superrstudio/agent-registration.test.cjs
          tests/superrstudio/agent-accounts.test.cjs
          tests/superrstudio/agent-staged-workspace.test.cjs
          tests/superrstudio/agent-antigravity-policy.test.cjs
          tests/superrstudio/agent-provider.test.cjs
          tests/superrstudio/agent-chat-bridge.test.cjs
          tests/superrstudio/agent-gemini-api.test.cjs
          tests/superrstudio/agent-project-context.test.cjs
          tests/superrstudio/agent-edit-proposal.test.cjs
          tests/superrstudio/agent-conversation-store.test.cjs
  updater:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Update release and signature tests
        run: node --test tests/superrstudio/updater-releases.test.cjs tests/superrstudio/updater-manifest.test.cjs tests/superrstudio/updater-download.test.cjs

  checks:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Product identity and branding consistent
        shell: powershell
        run: tools/superrstudio/check-identity.ps1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2, resolved 2026-10-27
        with:
          r-version: '4.6.1'
      - name: Install test packages (CRAN binaries)
        run: Rscript -e "install.packages(c('ggplot2', 'tibble', 'data.table', 'TropFishR', 'readxl'), repos = 'https://cloud.r-project.org')"
      - name: Plot editor contract tests
        run: Rscript tests/superrstudio/visual-scatter.R
      - name: Length-frequency contract tests
        run: Rscript tests/superrstudio/lfq-tropfishr.R
      - name: Data table contract tests (typed tables, text and Excel files)
        run: Rscript tests/superrstudio/data-entry.R
      - name: Optional-package installation contract tests (local repository built from CRAN)
        run: Rscript tests/superrstudio/deps.R
