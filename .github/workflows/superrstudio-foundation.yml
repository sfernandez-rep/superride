name: SuperRStudio foundation (not an IDE build)

on:
  push:
    branches: [main, develop]
    paths:
      - 'superrstudio/**'
      - 'tools/superrstudio/**'
      - 'tests/superrstudio/**'
      - '.github/workflows/superrstudio-foundation.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'superrstudio/**'
      - 'tools/superrstudio/**'
      - 'tests/superrstudio/**'
      - '.github/workflows/superrstudio-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check source provenance and licenses
        run: python tools/superrstudio/check-baseline.py --pristine
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2, resolved 2026-10-27
        with:
          r-version: '4.6.1'
      - name: Check standalone R reference fixture (not IDE integration)
        run: Rscript --vanilla tests/superrstudio/runtime-smoke.R
