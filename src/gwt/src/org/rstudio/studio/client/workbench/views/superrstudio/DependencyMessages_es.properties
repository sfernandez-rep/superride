# Spanish messages for DependencyMessages (generated alongside the Java interface)
title=Paquetes de R para SuperR
featurePlot=El editor de gráficos
featureLfq=El análisis de frecuencias de tallas
featureSheet=La lectura de archivos Excel
intro={0} necesita paquetes de R que no están disponibles en esta sesión de R:
packageMissing={0} {1} o más reciente: no instalado
packageOld={0} {1} o más reciente: está instalada la versión {2}
whyGgplot2=ggplot2 dibuja la vista previa y lo usa el código de gráficos generado.
whyReadxl=readxl lee archivos .xlsx y .xls; los archivos CSV y de texto no necesitan ningún paquete.
whyTropfishr=TropFishR realiza los análisis (datos de frecuencias de tallas, crecimiento ELEFAN, mortalidad, rendimiento por recluta).
checking=Consultando el repositorio de paquetes…
version=Versión a instalar: {0}.
dependencies=También instala {0} paquete(s) de los que depende: {1}.
noDependencies=No se necesitan otros paquetes.
source=Origen: {0} (se instala con install.packages(); paquetes binarios cuando están disponibles).
target=Biblioteca: {0}
renv=Este proyecto usa renv ({0}): los paquetes van solo a la biblioteca del proyecto. renv.lock no se modifica; ejecuta renv::snapshot() para registrarlos.
notWritable=Esta biblioteca no admite escritura, así que SuperR no puede instalar aquí. Instala los paquetes en una biblioteca con permiso de escritura (por ejemplo con install.packages() en la consola) y vuelve a intentarlo.
problemRepository=No se pudo leer el repositorio de paquetes. Revisa la conexión de red o la opción repos (options("repos")).
problemUnavailable=El paquete no está disponible en el repositorio configurado.
problemVersion=El repositorio no ofrece una versión suficientemente reciente.
consent=No se instala nada salvo que elijas Instalar. El resto de SuperR sigue disponible mientras se instalan los paquetes.
install=Instalar
cancel=Cancelar
stop=Detener la instalación
close=Cerrar
