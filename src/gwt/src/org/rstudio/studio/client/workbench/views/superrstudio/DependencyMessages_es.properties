done=Instalado y verificado. Continuando.
failed=La instalación falló:
stopped=Instalación detenida.
locks=La instalación interrumpida dejó estas carpetas en {0}: {1}. R las elimina en la próxima instalación, o puedes borrarlas.
missingHint={0} necesita {1}, que no está instalado.
installButton=Instalar {0}…
